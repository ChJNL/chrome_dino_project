<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>심플 돌진 파괴 게임</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }

        body { background-color: #f7f7f7; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; user-select: none; }
        
        #game { position: relative; width: 600px; height: 150px; background-color: #f7f7f7; overflow: hidden; border-bottom: 2px solid #535353; touch-action: none; }

        #score-area { position: absolute; top: 10px; right: 10px; color: #535353; font-size: 18px; font-weight: bold; z-index: 10; }

        /* 판정 존 (여기에 선인장이 들어올 때 C키를 눌러야 함) */
        #target-zone { position: absolute; left: 70px; bottom: 0; width: 45px; height: 100px; border-left: 2px dashed #ff4500; border-right: 2px dashed #ff4500; background: rgba(255, 69, 0, 0.08); z-index: 2; pointer-events: none; }

        /* 플레이어 (공룡) */
        #dino { position: absolute; left: 40px; bottom: 2px; width: 28px; height: 32px; background: #535353; z-index: 5; transition: transform 0.05s; }
        #dino.dashing { transform: translateX(25px) skewX(-15deg); background: #ffaa00; }

        /* 선인장 */
        #cactus { position: absolute; left: 600px; bottom: 2px; width: 16px; height: 35px; background: #535353; z-index: 4; }

        /* 오버레이 화면 */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #535353; font-size: 15px; font-weight: bold; background-color: #f7f7f7; z-index: 20; text-align: center; padding: 10px; }
        .gameover-text { font-size: 22px; color: #ff4500; margin-bottom: 8px; }
    </style>
</head>
<body>

<div id="game">
    <div id="target-zone"></div>
    <div id="score-area">SCORE: <span id="score">0</span></div>
    <div id="dino"></div>
    <div id="cactus"></div>

    <div class="overlay" id="msg-start">
        <p style="font-size: 18px; margin-bottom: 5px;">🎯 타이밍 돌진 게임</p>
        <p style="color: #ff4500; margin-bottom: 10px;">선인장이 주황색 존에 들어올 때</p>
        <p>[ C 키 ] 또는 [ 화면 터치 ]로 돌진해 파괴하세요!</p>
        <p style="font-size: 12px; color: #888; margin-top: 15px;">[ 화면을 터치하면 시작합니다 ]</p>
    </div>

    <div class="overlay" id="msg-gameover" style="display: none;">
        <p class="gameover-text">GAME OVER</p>
        <p style="font-size: 13px; color: #747474;">화면을 터치하면 다시 시작합니다</p>
    </div>
</div>

<script>
    const game = document.getElementById('game');
    const dino = document.getElementById('dino');
    const cactus = document.getElementById('cactus');
    const scoreDisplay = document.getElementById('score');
    const msgStart = document.getElementById('msg-start');
    const msgGameover = document.getElementById('msg-gameover');

    let state = 'START'; // START, PLAYING, GAMEOVER
    let score = 0;
    let cactusX = 600;
    let cactusSpeed = 3;
    let animationId = null;

    function startGame() {
        state = 'PLAYING';
        score = 0;
        cactusX = 600;
        cactusSpeed = 3;
        scoreDisplay.innerText = score;
        msgStart.style.display = 'none';
        msgGameover.style.display = 'none';
        
        if (animationId) cancelAnimationFrame(animationId);
        update();
    }

    function endGame() {
        state = 'GAMEOVER';
        cancelAnimationFrame(animationId);
        msgGameover.style.display = 'flex';
    }

    function action() {
        if (state === 'START' || state === 'GAMEOVER') {
            startGame();
            return;
        }

        if (state === 'PLAYING') {
            // 돌진 모션 시각 효과
            dino.classList.add('dashing');
            setTimeout(() => dino.classList.remove('dashing'), 120);

            // 판정 존 범위 (주황색 박스 위치: 70 ~ 115)
            if (cactusX >= 65 && cactusX <= 120) {
                // 성공: 선인장 리셋 및 점수 증가
                score++;
                scoreDisplay.innerText = score;
                cactusX = 600;
                cactusSpeed += 0.2; // 점점 빨라짐
            } else {
                // 실패: 존에 없는데 누름
                endGame();
            }
        }
    }

    function update() {
        if (state !== 'PLAYING') return;

        // 선인장 이동
        cactusX -= cactusSpeed;
        cactus.style.left = cactusX + 'px';

        // 선인장을 놓치고 지나친 경우 게임 오버
        if (cactusX < 30) {
            endGame();
            return;
        }

        animationId = requestAnimationFrame(update);
    }

    // 이벤트 리스너 (터치 및 C키)
    game.addEventListener('touchstart', (e) => {
        e.preventDefault();
        action();
    });

    window.addEventListener('keydown', (e) => {
        if (e.code === 'KeyC' || e.key === 'c' || e.key === 'C' || e.code === 'Space') {
            e.preventDefault();
            action();
        }
    });
</script>
</body>
</html>
