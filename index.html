<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <title>크롬 스타일 브라키오 게임 - 최종 액션 버전</title>
    <style>
        /* 기본 스타일 및 낮/밤 테마 */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }

        :root { --bg-color: #f7f7f7; --main-color: #535353; --sub-color: #747474; }
        body.night-mode { --bg-color: #0a0e27; --main-color: #e8eaed; --sub-color: #9aa0a6; }

        body { background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; user-select: none; transition: background-color 0.3s ease; -webkit-touch-callout: none; }
        
        #game { position: relative; width: 600px; height: 150px; background-color: var(--bg-color); overflow: hidden; border-bottom: 2px solid var(--main-color); transition: background-color 0.3s ease, border-color 0.3s ease; touch-action: none; }

        /* 지진 효과 */
        @keyframes shake {
            0%, 100% { transform: translateX(0px) translateY(0px); }
            10% { transform: translateX(-6px) translateY(3px); }
            20% { transform: translateX(6px) translateY(-3px); }
            30% { transform: translateX(-6px) translateY(3px); }
            40% { transform: translateX(6px) translateY(-3px); }
            50% { transform: translateX(-3px) translateY(2px); }
            60% { transform: translateX(3px) translateY(-2px); }
            70% { transform: translateX(-3px) translateY(2px); }
            80% { transform: translateX(3px) translateY(-2px); }
            90% { transform: translateX(-1px) translateY(0px); }
        }
        
        #game.shake { animation: shake 0.5s ease-in-out; }

        /* 점수 영역 */
        #score-area { position: absolute; top: 10px; right: 10px; color: var(--main-color); font-size: 18px; font-weight: bold; z-index: 10; }
        #hi-score { margin-right: 15px; color: var(--sub-color); }

        /* 별 획득 UI */
        #star-timer { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; z-index: 25; text-align: center; }
        .star-icon { font-size: 48px; margin-bottom: 10px; }
        .star-text { color: var(--main-color); font-size: 24px; font-weight: bold; }

        /* CLEAR 화면 */
        #clear-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.95); display: none; z-index: 100; flex-direction: column; justify-content: center; align-items: center; }
        .clear-text { color: white; font-size: 64px; font-weight: bold; letter-spacing: 10px; text-shadow: 0 0 20px yellow; animation: clearPulse 0.6s infinite; }
        @keyframes clearPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

        /* 별과 달 컨테이너 */
        .stars-container { position: absolute; width: 100%; height: 100%; z-index: 0; display: none; }
        body.night-mode .stars-container { display: block; }

        /* 배경 구름 */
        .cloud { position: absolute; width: 4px; height: 4px; background: transparent; box-shadow: 12px 0px 0 var(--main-color), 16px 0px 0 var(--main-color), 20px 0px 0 var(--main-color), 4px 4px 0 var(--main-color), 8px 4px 0 var(--main-color), 12px 4px 0 var(--main-color), 16px 4px 0 var(--main-color), 20px 4px 0 var(--main-color), 24px 4px 0 var(--main-color), 28px 4px 0 var(--main-color), 0px 8px 0 var(--main-color), 4px 8px 0 var(--main-color), 8px 8px 0 var(--main-color), 12px 8px 0 var(--main-color), 16px 8px 0 var(--main-color), 20px 8px 0 var(--main-color), 24px 8px 0 var(--main-color), 8px 12px 0 var(--main-color), 12px 12px 0 var(--main-color); opacity: 0.6; z-index: 1; }

        /* 공룡 공통 베이스 */
        #dino { position: absolute; left: 40px; bottom: 2px; width: 4px; height: 4px; background: transparent; z-index: 5; }

        /* 브라키오 총 */
        .gun { display: none; position: absolute; width: 14px; height: 6px; background: var(--main-color); bottom: 12px; left: 32px; border-radius: 0 3px 3px 0; z-index: 6; }
        .armed .gun { display: block; }
        .bullet { position: absolute; width: 8px; height: 4px; background: #ffaa00; border-radius: 2px; z-index: 6; box-shadow: 0 0 4px #ff0000; }

        /* 서서 달리기 A */
        .stand-a { box-shadow: 36px -32px 0 var(--main-color), 40px -32px 0 var(--main-color), 44px -32px 0 var(--main-color), 36px -28px 0 var(--main-color), 40px -28px 0 var(--main-color), 36px -24px 0 var(--main-color), 36px -20px 0 var(--main-color), 32px -16px 0 var(--main-color), 36px -16px 0 var(--main-color), 28px -12px 0 var(--main-color), 32px -12px 0 var(--main-color), 12px -8px 0 var(--main-color), 16px -8px 0 var(--main-color), 20px -8px 0 var(--main-color), 24px -8px 0 var(--main-color), 28px -8px 0 var(--main-color), 8px -4px 0 var(--main-color), 12px -4px 0 var(--main-color), 16px -4px 0 var(--main-color), 20px -4px 0 var(--main-color), 24px -4px 0 var(--main-color), 28px -4px 0 var(--main-color), 4px 0px 0 var(--main-color), 8px 0px 0 var(--main-color), 12px 0px 0 var(--main-color), 16px 0px 0 var(--main-color), 20px 0px 0 var(--main-color), 24px 0px 0 var(--main-color), 8px 4px 0 var(--main-color), 24px 4px 0 var(--main-color); }
        /* 서서 달리기 B */
        .stand-b { box-shadow: 36px -32px 0 var(--main-color), 40px -32px 0 var(--main-color), 44px -32px 0 var(--main-color), 36px -28px 0 var(--main-color), 40px -28px 0 var(--main-color), 36px -24px 0 var(--main-color), 36px -20px 0 var(--main-color), 32px -16px 0 var(--main-color), 36px -16px 0 var(--main-color), 28px -12px 0 var(--main-color), 32px -12px 0 var(--main-color), 12px -8px 0 var(--main-color), 16px -8px 0 var(--main-color), 20px -8px 0 var(--main-color), 24px -8px 0 var(--main-color), 28px -8px 0 var(--main-color), 8px -4px 0 var(--main-color), 12px -4px 0 var(--main-color), 16px -4px 0 var(--main-color), 20px -4px 0 var(--main-color), 24px -4px 0 var(--main-color), 28px -4px 0 var(--main-color), 4px 0px 0 var(--main-color), 8px 0px 0 var(--main-color), 12px 0px 0 var(--main-color), 16px 0px 0 var(--main-color), 20px 0px 0 var(--main-color), 24px 0px 0 var(--main-color), 12px 4px 0 var(--main-color), 20px 4px 0 var(--main-color); }
        /* 숙여서 달리기 A */
        .duck-a { box-shadow: 12px -8px 0 var(--main-color), 16px -8px 0 var(--main-color), 20px -8px 0 var(--main-color), 24px -8px 0 var(--main-color), 28px -8px 0 var(--main-color), 32px -8px 0 var(--main-color), 36px -8px 0 var(--main-color), 40px -8px 0 var(--main-color), 8px -4px 0 var(--main-color), 12px -4px 0 var(--main-color), 16px -4px 0 var(--main-color), 20px -4px 0 var(--main-color), 24px -4px 0 var(--main-color), 28px -4px 0 var(--main-color), 32px -4px 0 var(--main-color), 4px 0px 0 var(--main-color), 8px 0px 0 var(--main-color), 12px 0px 0 var(--main-color), 16px 0px 0 var(--main-color), 20px 0px 0 var(--main-color), 24px 0px 0 var(--main-color), 28px 0px 0 var(--main-color), 8px 4px 0 var(--main-color), 24px 4px 0 var(--main-color); }
        /* 숙여서 달리기 B */
        .duck-b { box-shadow: 12px -8px 0 var(--main-color), 16px -8px 0 var(--main-color), 20px -8px 0 var(--main-color), 24px -8px 0 var(--main-color), 28px -8px 0 var(--main-color), 32px -8px 0 var(--main-color), 36px -8px 0 var(--main-color), 40px -8px 0 var(--main-color), 8px -4px 0 var(--main-color), 12px -4px 0 var(--main-color), 16px -4px 0 var(--main-color), 20px -4px 0 var(--main-color), 24px -4px 0 var(--main-color), 28px -4px 0 var(--main-color), 32px -4px 0 var(--main-color), 4px 0px 0 var(--main-color), 8px 0px 0 var(--main-color), 12px 0px 0 var(--main-color), 16px 0px 0 var(--main-color), 20px 0px 0 var(--main-color), 24px 0px 0 var(--main-color), 28px 0px 0 var(--main-color), 12px 4px 0 var(--main-color), 20px 4px 0 var(--main-color); }

        /* 장애물 구조 */
        .obstacle { position: absolute; background: transparent; z-index: 4; }
        .cactus { bottom: 2px; width: 4px; height: 4px; box-shadow: 8px -24px 0 var(--main-color), 8px -20px 0 var(--main-color), 0px -16px 0 var(--main-color), 8px -16px 0 var(--main-color), 16px -16px 0 var(--main-color), 0px -12px 0 var(--main-color), 8px -12px 0 var(--main-color), 16px -12px 0 var(--main-color), 0px -8px 0 var(--main-color), 8px -8px 0 var(--main-color), 8px -4px 0 var(--main-color), 8px 0px 0 var(--main-color); transition: all 0.2s; }
        .cactus.broken { box-shadow: none !important; }
        .cactus.growing { transform-origin: bottom center; animation: cactusGrow 2s ease-out forwards; }
        @keyframes cactusGrow { from { transform: scaleY(1); } to { transform: scaleY(6.25); } }

        /* 거대 선인장을 먹었을 때 쓰러지는 애니메이션 */
        .cactus.falling { transform-origin: bottom center; animation: cactusFall 0.5s ease-in forwards; }
        @keyframes cactusFall {
            0% { transform: scaleY(6.25) rotate(0deg); opacity: 1; }
            40% { transform: scaleY(5) rotate(55deg) translateX(6px); opacity: 0.9; }
            100% { transform: scaleY(1) rotate(100deg) translateX(24px) translateY(10px); opacity: 0; }
        }

        /* 브라키오가 거대 선인장을 먹는 애니메이션 */
        #dino.eating { transform-origin: bottom left; animation: eatBite 0.5s ease-in-out; }
        @keyframes eatBite {
            0% { transform: scaleX(1) scaleY(1) translateX(0); }
            20% { transform: scaleX(1.15) scaleY(0.85) translateX(3px); }
            50% { transform: scaleX(0.9) scaleY(1.1) translateX(-2px); }
            75% { transform: scaleX(1.08) scaleY(0.92) translateX(2px); }
            100% { transform: scaleX(1) scaleY(1) translateX(0); }
        }
        
        /* 프테라노돈 - 새로운 디자인 */
        .ptera { width: 4px; height: 4px; position: relative; }
        .ptera.fly-a { box-shadow: 
            /* 머리 */ 20px -8px 0 var(--main-color), 24px -8px 0 var(--main-color), 28px -8px 0 var(--main-color),
            /* 부리 */ 32px -8px 0 var(--main-color), 36px -8px 0 var(--main-color),
            /* 크레스트 */ 24px -12px 0 var(--main-color), 20px -12px 0 var(--main-color),
            /* 몸 */ 16px -4px 0 var(--main-color), 20px -4px 0 var(--main-color), 16px 0px 0 var(--main-color), 20px 0px 0 var(--main-color),
            /* 왼쪽 날개 상단 */ 8px -10px 0 var(--main-color), 4px -8px 0 var(--main-color), 0px -6px 0 var(--main-color),
            /* 오른쪽 날개 상단 */ 32px -10px 0 var(--main-color), 36px -8px 0 var(--main-color), 40px -6px 0 var(--main-color),
            /* 다리 */ 18px 4px 0 var(--main-color), 22px 4px 0 var(--main-color); }
        .ptera.fly-b { box-shadow: 
            /* 머리 */ 20px -8px 0 var(--main-color), 24px -8px 0 var(--main-color), 28px -8px 0 var(--main-color),
            /* 부리 */ 32px -8px 0 var(--main-color), 36px -8px 0 var(--main-color),
            /* 크레스트 */ 24px -12px 0 var(--main-color), 20px -12px 0 var(--main-color),
            /* 몸 */ 16px -4px 0 var(--main-color), 20px -4px 0 var(--main-color), 16px 0px 0 var(--main-color), 20px 0px 0 var(--main-color),
            /* 왼쪽 날개 하단 */ 8px -8px 0 var(--main-color), 4px -4px 0 var(--main-color), 0px -2px 0 var(--main-color),
            /* 오른쪽 날개 하단 */ 32px -8px 0 var(--main-color), 36px -4px 0 var(--main-color), 40px -2px 0 var(--main-color),
            /* 다리 */ 18px 4px 0 var(--main-color), 22px 4px 0 var(--main-color); }

        /* 메테오 */
        .meteor { position: absolute; width: 4px; height: 4px; background: #FF6347; z-index: 3; pointer-events: none; }

        /* 다양한 아기 공룡 */
        .baby-dino { position: absolute; width: 4px; height: 4px; background: transparent; z-index: 4; transform: scale(0.6); transform-origin: bottom left; }

        /* 보스 티라노 */
        .trex { position: absolute; width: 4px; height: 4px; background: transparent; z-index: 15; transform: scale(1.6) scaleX(-1); transform-origin: bottom right; }
        .trex-hp { position: absolute; top: -25px; left: -15px; color: red; font-size: 10px; font-weight: bold; transform: scaleX(-1); width: 60px; pointer-events: none; }

        /* 불 파티클 */
        .fire { position: absolute; width: 8px; height: 8px; background: #FF4500; border-radius: 50%; z-index: 7; box-shadow: 0 0 8px #FF8C00; }

        /* 안내 문구 오버레이 */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--main-color); font-size: 16px; font-weight: bold; background-color: var(--bg-color); z-index: 20; text-align: center; padding: 10px; }
        .msg-gameover { display: none; }
        .gameover-text { font-size: 24px; letter-spacing: 5px; margin-bottom: 10px; }
        .restart-text { font-size: 14px; color: var(--sub-color); }
    </style>
</head>
<body>

<div id="game">
    <div class="stars-container" id="stars-container"></div>
    <div id="clouds"></div>
    <div id="clear-screen">
        <div class="clear-text">CLEAR</div>
    </div>
    <div id="star-timer">
        <div class="star-icon">⭐</div>
        <div class="star-text" id="timer-text">3</div>
    </div>
    <div id="score-area">
        <span id="hi-score">HI 00000</span>
        <span id="score">00000</span>
    </div>
    <div id="dino" class="stand-a">
        <div class="gun"></div>
    </div>
    <div id="obstacles"></div>
    <div class="overlay msg-start" id="msg-start">
        <p>📱 왼쪽(숙이기) / 오른쪽(점프 맟 사격)</p>
        <p style="font-size: 12px; margin-top: 5px; color: #747474;">⌨️ PC: ↑(점프 및 사격) / ↓(숙이기)</p>
        <p style="font-size: 13px; margin-top: 10px; color: var(--main-color); background: rgba(0,0,0,0.05); padding: 5px 10px; border-radius: 4px;">[ 화면을 터치하면 시작합니다 ]</p>
    </div>
    <div class="overlay msg-gameover" id="msg-gameover">
        <p class="gameover-text">GAME OVER</p>
        <p class="restart-text">화면을 터치하면 재시작</p>
    </div>
</div>

<script>
    const gameContainer = document.getElementById('game');
    const body = document.body;
    const dino = document.getElementById('dino');
    const scoreDisplay = document.getElementById('score');
    const hiScoreDisplay = document.getElementById('hi-score');
    const obstaclesContainer = document.getElementById('obstacles');
    const cloudsContainer = document.getElementById('clouds');
    const starsContainer = document.getElementById('stars-container');
    const msgStart = document.getElementById('msg-start');
    const msgGameover = document.getElementById('msg-gameover');
    const starTimerUI = document.getElementById('star-timer');
    const timerText = document.getElementById('timer-text');
    const clearScreen = document.getElementById('clear-screen');

    let isPlaying = false;
    let score = 0;
    let hiScore = 0;
    let scoreInterval;
    let gameLoopInterval;
    let isNight = false;
    let gameCleared = false;
    
    let isJumping = false;
    let isDucking = false; 
    let dinoY = 0;
    let jumpVelocity = 0;
    const gravity = 0.6; 

    let obstacles = [];
    let clouds = [];
    let obstacleSpeed = 4; 
    const cloudSpeed = 1; 
    let nextSpawnDistance = 300; 

    let animTimer = 0;
    let currentFrame = 'a';
    let pteraFrame = 'a';

    let meteors = [];
    let babyDinos = [];
    let dinoHistory = []; 
    let trex = null;
    let finalBoss = null;
    let bullets = [];
    let cactusList = [];
    let growingCactus = null;
    let fires = [];
    let lastGrowScore = 0;

    // 별 획득 타이머
    let starActive = false;
    let starTimer = 0;

    // 거대 선인장 먹기 상태
    let isEating = false;

    // 지진 효과 함수
    function triggerEarthquake() {
        gameContainer.classList.remove('shake');
        void gameContainer.offsetWidth;
        gameContainer.classList.add('shake');
    }

    // 별 획득 이벤트
    function activateStar() {
        starActive = true;
        starTimer = 3;
        starTimerUI.style.display = 'flex';
        
        let countdown = 3;
        const countdownInterval = setInterval(() => {
            countdown--;
            timerText.innerText = Math.max(0, countdown);
            if (countdown < 0) {
                clearInterval(countdownInterval);
                starActive = false;
                starTimerUI.style.display = 'none';
            }
        }, 1000);
    }

    // 별 생성
    function createStars() {
        starsContainer.innerHTML = '';
        
        const starPositions = [
            {x: 50, y: 30},
            {x: 120, y: 20},
            {x: 200, y: 45},
            {x: 280, y: 25},
            {x: 350, y: 40},
            {x: 420, y: 35},
            {x: 480, y: 20},
            {x: 550, y: 50}
        ];

        starPositions.forEach((pos, idx) => {
            const star = document.createElement('div');
            star.style.position = 'absolute';
            star.style.width = '4px';
            star.style.height = '4px';
            star.style.background = 'transparent';
            star.style.left = pos.x + 'px';
            star.style.top = pos.y + 'px';
            star.style.zIndex = '1';
            
            star.style.boxShadow = `
                0px 0px 0px #e8eaed,
                4px 0px 0px #e8eaed,
                -4px 0px 0px #e8eaed,
                0px 4px 0px #e8eaed,
                0px -4px 0px #e8eaed
            `;
            
            star.style.animation = `starMove ${15 + idx}s linear infinite`;
            starsContainer.appendChild(star);
        });

        const moon = document.createElement('div');
        moon.style.position = 'absolute';
        moon.style.width = '4px';
        moon.style.height = '4px';
        moon.style.background = 'transparent';
        moon.style.left = '520px';
        moon.style.top = '25px';
        moon.style.zIndex = '1';
        
        moon.style.boxShadow = `
            0px 0px 0px #fffacd,
            4px 0px 0px #fffacd,
            8px 0px 0px #fffacd,
            -4px 0px 0px #fffacd,
            -8px 0px 0px #fffacd,
            0px 4px 0px #fffacd,
            4px 4px 0px #fffacd,
            8px 4px 0px #fffacd,
            -4px 4px 0px #fffacd,
            -8px 4px 0px #fffacd,
            0px -4px 0px #fffacd,
            4px -4px 0px #fffacd,
            8px -4px 0px #fffacd,
            -4px -4px 0px #fffacd,
            -8px -4px 0px #fffacd
        `;
        
        moon.style.animation = 'moonMove 720s linear infinite';
        starsContainer.appendChild(moon);

        if (!document.getElementById('night-animations')) {
            const style = document.createElement('style');
            style.id = 'night-animations';
            style.textContent = `
                @keyframes starMove {
                    0% { transform: translateX(0px); }
                    100% { transform: translateX(-700px); }
                }
                @keyframes moonMove {
                    0% { left: 520px; }
                    100% { left: -100px; }
                }
            `;
            document.head.appendChild(style);
        }
    }

    // 무기 발사 함수
    function shootGun() {
        if (!isPlaying) return;
        const bullet = document.createElement('div');
        bullet.className = 'bullet';
        let bX = 40 + 44;
        let bY = dinoY + 14; 
        bullet.style.left = bX + 'px';
        bullet.style.bottom = bY + 'px';
        gameContainer.appendChild(bullet);
        bullets.push({ el: bullet, x: bX, y: bY });
    }

    // 모바일 터치
    gameContainer.addEventListener('touchstart', function(e) {
        if (!isPlaying && msgStart.style.display !== 'none') { e.preventDefault(); startGame(); return; }
        if (!isPlaying && msgGameover.style.display !== 'none') { e.preventDefault(); startGame(); return; }

        if(isPlaying) {
            e.preventDefault();
            const touchX = e.touches[0].clientX - gameContainer.getBoundingClientRect().left;
            const gameWidth = gameContainer.clientWidth;

            if (touchX > gameWidth / 2) {
                const eatable = canEatGiantCactus();
                if (trex || finalBoss) {
                    shootGun();
                } else if (eatable) {
                    eatGiantCactus(eatable);
                } else if (!isJumping && !isDucking) { 
                    isJumping = true; jumpVelocity = 10; 
                }
            } else {
                if (!isJumping && !trex && !finalBoss) { isDucking = true; } 
            }
        }
    }, { passive: false });

    gameContainer.addEventListener('touchend', function(e) {
        if(isPlaying) { e.preventDefault(); isDucking = false; }
    }, { passive: false });

    // PC 키보드
    window.addEventListener('keydown', function(e) {
        if (!isPlaying) {
            if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); startGame(); }
            return;
        }

        if (e.code === 'Space' || e.code === 'ArrowUp') {
            e.preventDefault(); 
            const eatable = canEatGiantCactus();
            if (trex || finalBoss) {
                shootGun();
            } else if (eatable) {
                eatGiantCactus(eatable);
            } else if (!isJumping && !isDucking) { 
                isJumping = true; jumpVelocity = 10; 
            }
        } else if (e.code === 'ArrowDown') {
            e.preventDefault();
            if (!isJumping && !trex && !finalBoss) { isDucking = true; }
        }
    });

    window.addEventListener('keyup', function(e) {
        if (e.code === 'ArrowDown') { e.preventDefault(); isDucking = false; }
    });


    function startGame() {
        isPlaying = true;
        gameCleared = false;
        score = 0;
        dinoY = 0;
        isJumping = false;
        isDucking = false; 
        jumpVelocity = 0;
        obstacles = [];
        clouds = [];
        cactusList = [];
        growingCactus = null;
        isNight = false;
        obstacleSpeed = 4; 
        nextSpawnDistance = 250;
        starActive = false;
        lastGrowScore = 0;
        isEating = false;
        dino.classList.remove('eating');

        for (let i = meteors.length - 1; i >= 0; i--) {
            if (meteors[i] && meteors[i].el) {
                meteors[i].el.remove();
            }
        }
        meteors = [];

        for (let i = babyDinos.length - 1; i >= 0; i--) {
            if (babyDinos[i] && babyDinos[i].el) {
                babyDinos[i].el.remove();
            }
        }
        babyDinos = [];

        for (let i = bullets.length - 1; i >= 0; i--) {
            if (bullets[i] && bullets[i].el) {
                bullets[i].el.remove();
            }
        }
        bullets = [];

        for (let i = fires.length - 1; i >= 0; i--) {
            if (fires[i] && fires[i].el) {
                fires[i].el.remove();
            }
        }
        fires = [];

        if(trex && trex.el) { 
            trex.el.remove(); 
            trex = null; 
            dino.classList.remove('armed'); 
        }

        if(finalBoss && finalBoss.el) { 
            finalBoss.el.remove(); 
            finalBoss = null; 
        }
        
        dinoHistory = [];

        dino.style.transition = 'none';
        dino.style.transform = 'none';
        dino.style.left = '40px';
        dino.style.bottom = '2px';
        dino.style.top = 'auto';
        dino.style.zIndex = '5';
        gameContainer.style.overflow = 'hidden';
        dino.classList.remove('armed');

        obstaclesContainer.innerHTML = '';
        cloudsContainer.innerHTML = '';
        starsContainer.innerHTML = '';
        starTimerUI.style.display = 'none';
        clearScreen.style.display = 'none';
        body.classList.remove('night-mode');
        msgStart.style.display = 'none';
        msgGameover.style.display = 'none';
        scoreDisplay.innerText = '00000';

        clearInterval(scoreInterval);
        clearInterval(gameLoopInterval);

        setTimeout(() => {
            scoreInterval = setInterval(() => {
                if (!isPlaying) return;
                score++;
                scoreDisplay.innerText = String(score).padStart(5, '0');

                if (score > 0 && score % 600 === 0) toggleNightMode();
                
                if (score > 0 && score % 150 === 0) createMeteor();
                
                if (score > 0 && score % 600 === 0) createBabyDino();
                
                // 200점마다 선인장 성장 체크
                if (score > 0 && Math.floor(score / 200) > lastGrowScore && Math.random() < 0.5) {
                    lastGrowScore = Math.floor(score / 200);
                    growCactus();
                }
                
                // 1000점에서 보스 출현
                if (score === 1000 && !finalBoss && !trex) {
                    createFinalBoss();
                }
                
                // 600점마다 50% 확률로 별
                if (score > 0 && score % 600 === 0 && Math.random() < 0.5) {
                    activateStar();
                }
                
            }, 50);

            gameLoopInterval = setInterval(updateGame, 1000 / 60);
        }, 100);
    }

    function toggleNightMode() {
        isNight = !isNight;
        if (isNight) {
            body.classList.add('night-mode');
            createStars();
        } else {
            body.classList.remove('night-mode');
            starsContainer.innerHTML = '';
        }
        obstacleSpeed += 0.5; 
    }

    // 선인장 성장
    function growCactus() {
        if (!cactusList || cactusList.length === 0) return;
        
        const cactus = cactusList[0];
        growingCactus = cactus;
        cactus.el.classList.add('growing');
        cactus.growStart = performance.now();
        cactus.isGrowing = true; // 매 프레임 히트박스를 실제 애니메이션 진행률에 맞춰 갱신하기 위한 플래그
    }

    // 거대해진 선인장이 사정거리 안에 들어왔는지 확인 (점프 대신 먹기가 가능한 상태)
    function canEatGiantCactus() {
        if (!growingCactus || growingCactus.eaten || isEating || isJumping) return null;
        const dinoRight = 40 + (isDucking ? 40 : 32);
        const obsLeft = growingCactus.x + growingCactus.hitbox.left;
        const EAT_RANGE = 40; // 선인장이 이 거리 안으로 들어오면 먹기 입력을 받음
        if (obsLeft - dinoRight < EAT_RANGE && obsLeft + 20 > 0) {
            return growingCactus;
        }
        return null;
    }

    // 거대 선인장을 먹는 동작: 점프 대신 실행되는 액션
    function eatGiantCactus(cactus) {
        cactus.eaten = true;
        cactus.hitbox = { left: 0, right: 0, bottom: 0, top: 0 }; // 즉시 충돌 무효화 (먹는 도중 죽지 않도록)
        isEating = true;

        dino.classList.add('eating');
        cactus.el.classList.remove('growing');
        cactus.el.classList.add('falling');
        score += 50; // 거대 선인장을 먹은 보상 점수

        setTimeout(() => {
            dino.classList.remove('eating');
            isEating = false;
        }, 500);

        setTimeout(() => {
            cactus.el.remove();
            obstacles = obstacles.filter(o => o !== cactus);
            cactusList = cactusList.filter(o => o !== cactus);
            if (growingCactus === cactus) growingCactus = null;
        }, 500);
    }

    function updateGame() {
        if (!isPlaying) return;

        // --- 공룡 물리 ---
        if (isJumping) {
            dinoY += jumpVelocity;
            jumpVelocity -= gravity; 

            if (dinoY <= 0) {
                dinoY = 0;
                isJumping = false;
                jumpVelocity = 0;
            }
        }
        dino.style.bottom = (2 + dinoY) + 'px';

        animTimer++;
        if (animTimer > 8) { 
            currentFrame = (currentFrame === 'a') ? 'b' : 'a';
            pteraFrame = (pteraFrame === 'a') ? 'b' : 'a';
            animTimer = 0;
        }

        dino.className = (trex || finalBoss ? 'armed ' : '') + (isEating ? 'eating ' : '');
        if (isJumping) dino.classList.add('stand-a'); 
        else if (isDucking) dino.classList.add(currentFrame === 'a' ? 'duck-a' : 'duck-b'); 
        else dino.classList.add(currentFrame === 'a' ? 'stand-a' : 'stand-b'); 

        // --- 아기 공룡 따라가기 ---
        dinoHistory.unshift({ y: dinoY, duck: isDucking, jump: isJumping, frame: currentFrame });
        if (dinoHistory.length > 300) dinoHistory.pop();

        babyDinos.forEach((baby, index) => {
            let delay = (index + 1) * 15; 
            if (delay >= dinoHistory.length) delay = dinoHistory.length - 1;
            let state = dinoHistory[delay];
            if (state) {
                baby.el.style.bottom = (2 + state.y) + 'px';
                baby.el.style.left = (40 - (index + 1) * 22) + 'px'; 
                
                baby.el.className = 'baby-dino ' + (state.jump ? 'stand-a' : (state.duck ? (state.frame==='a'?'duck-a':'duck-b') : (state.frame==='a'?'stand-a':'stand-b')));
            }
        });

        // --- 메테오 이동 (아래로 내려가면서 커짐) ---
        for (let i = meteors.length - 1; i >= 0; i--) {
            let m = meteors[i];
            m.y += 4; // 아래로 이동
            m.age++;
            
            // 크기 점점 커짐
            const scale = 1 + (m.age / 60) * 7;
            m.el.style.left = m.x + 'px';
            m.el.style.top = m.y + 'px';
            m.el.style.transform = `scale(${Math.max(0.5, Math.min(scale, 8))})`;

            // 화면 밖으로 나가면 삭제
            if (m.y > 160) { 
                m.el.remove(); 
                meteors.splice(i, 1); 
            }
        }

        // --- 불 파티클 ---
        if (finalBoss && finalBoss.breathing) {
            for (let i = fires.length - 1; i >= 0; i--) {
                let f = fires[i];
                f.x += f.vx;
                f.y -= 2;
                f.life--;
                f.el.style.left = f.x + 'px';
                f.el.style.top = f.y + 'px';
                f.el.style.opacity = f.life / 30;
                
                if (f.life <= 0) {
                    f.el.remove();
                    fires.splice(i, 1);
                }
            }
        }

        // --- 총알 이동 및 보스 타격 판정 ---
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += 10;
            b.el.style.left = b.x + 'px';
            
            if (b.x > 600) { b.el.remove(); bullets.splice(i, 1); continue; }
            
            if (trex && b.x > trex.x && b.x < trex.x + 40) {
                trex.hp--;
                trex.hpEl.innerText = 'HP: ' + trex.hp;
                
                trex.el.style.filter = 'drop-shadow(0 0 5px red) brightness(2)';
                setTimeout(() => { if(trex) trex.el.style.filter = 'none'; }, 100);

                b.el.remove(); bullets.splice(i, 1);

                if (trex.hp <= 0) {
                    trex.el.remove();
                    trex = null;
                    dino.classList.remove('armed');
                    score += 200; 
                    restoreCactus();
                    return;
                }
            }

            if (finalBoss && b.x > finalBoss.x && b.x < finalBoss.x + 40) {
                finalBoss.hp--;
                finalBoss.hpEl.innerText = 'HP: ' + finalBoss.hp;
                
                finalBoss.el.style.filter = 'drop-shadow(0 0 5px red) brightness(2)';
                setTimeout(() => { if(finalBoss) finalBoss.el.style.filter = 'none'; }, 100);

                b.el.remove(); bullets.splice(i, 1);

                if (finalBoss.hp <= 0) {
                    triggerFinalBossDeath();
                }
            }
        }

        // --- 보스 업데이트 ---
        if (trex && isPlaying) {
            trex.x -= obstacleSpeed * 0.4; 
            trex.el.style.left = trex.x + 'px';
            trex.el.className = 'trex ' + (currentFrame === 'a' ? 'stand-a' : 'stand-b'); 
            
            if (trex.x < 40 + 32) {
                endGame();
                return;
            }
        }

        if (finalBoss && isPlaying) {
            finalBoss.x -= obstacleSpeed * 0.3;
            finalBoss.el.style.left = finalBoss.x + 'px';
            finalBoss.el.className = 'trex ' + (currentFrame === 'a' ? 'stand-a' : 'stand-b');
            
            // 불 뿜기
            if (Math.random() < 0.1) {
                finalBoss.breathing = true;
                for (let j = 0; j < 5; j++) {
                    const fire = document.createElement('div');
                    fire.className = 'fire';
                    fire.style.left = (finalBoss.x + 20 + Math.random() * 20) + 'px';
                    fire.style.top = (100 + Math.random() * 30) + 'px';
                    gameContainer.appendChild(fire);
                    fires.push({
                        el: fire,
                        x: finalBoss.x + 20 + Math.random() * 20,
                        y: 100 + Math.random() * 30,
                        vx: -2 - Math.random() * 2,
                        life: 30
                    });
                }
            }
            
            if (finalBoss.x < 40 + 32) {
                endGame();
                return;
            }
        }

        // --- 배경 및 장애물 ---
        if (Math.random() < 0.005) createCloud();
        for (let i = clouds.length - 1; i >= 0; i--) {
            let cloud = clouds[i];
            cloud.x -= cloudSpeed;
            cloud.el.style.left = cloud.x + 'px';
            if (cloud.x < -40) { cloud.el.remove(); clouds.splice(i, 1); }
        }

        if (!trex && !finalBoss) {
            let lastObstacleX = 0;
            if (obstacles.length > 0) lastObstacleX = obstacles[obstacles.length - 1].x;

            if (obstacles.length === 0 || lastObstacleX < (600 - nextSpawnDistance)) {
                if (isNight && Math.random() > 0.5) createPtera();
                else createCactus(Math.random() > 0.5 ? 1 : 2);

                const dinoWidth = 44;
                let minDist = dinoWidth * 3, maxDist = dinoWidth * 6;
                if (isNight) { minDist += 40; maxDist += 70; }
                nextSpawnDistance = Math.random() * (maxDist - minDist) + minDist + (obstacleSpeed * 6);
            }
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.x -= obstacleSpeed;
            obs.el.style.left = obs.x + 'px';

            if (obs.x < -60) { 
                obs.el.remove(); 
                obstacles.splice(i, 1); 
                cactusList = cactusList.filter(c => c !== obs); // 화면 밖으로 나간 선인장은 목록에서도 제거 (안 그러면 growCactus가 이미 사라진 선인장을 계속 타겟팅함)
                if (growingCactus === obs) growingCactus = null;
                continue; 
            }

            // 자라는 중인 선인장: 히트박스를 실제 시각적 애니메이션 진행률에 맞춰 매 프레임 갱신
            // (고정된 지연시간으로 한 번에 키우면 시각적 크기와 판정이 어긋나는 순간이 생길 수 있음)
            if (obs.isGrowing && !obs.eaten) {
                const elapsed = performance.now() - obs.growStart;
                const progress = Math.min(elapsed / 2000, 1);
                obs.hitbox.top = 24 + (150 - 24) * progress;
                if (progress >= 1) obs.isGrowing = false;
            }

            if (isPlaying) {
                let dinoLeft = 40 + (isDucking ? 4 : 12), dinoRight = 40 + (isDucking ? 40 : 32);
                let dinoBottom = dinoY, dinoTop = dinoY + (isDucking ? 8 : 16);
                let obsLeft = obs.x + obs.hitbox.left, obsRight = obs.x + obs.hitbox.right;
                let obsBottom = obs.hitbox.bottom, obsTop = obs.hitbox.top;

                if (obsLeft < dinoRight && obsRight > dinoLeft && dinoBottom < obsTop && dinoTop > obsBottom) {
                    if (starActive && obs.el.classList.contains('cactus')) {
                        // 별 활성화 상태
                        obs.el.classList.add('broken');
                        obs.hitbox = { left: 0, right: 0, bottom: 0, top: 0 };
                    } else {
                        // 죽음
                        endGame();
                        return;
                    }
                }
            }
        }
    }

    function createMeteor() {
        if (!isPlaying) return;
        const el = document.createElement('div');
        el.className = 'meteor';
        let startX = 300 + Math.random() * 100;
        let startY = -80;
        el.style.left = startX + 'px';
        el.style.top = startY + 'px';
        el.style.width = '4px';
        el.style.height = '4px';
        gameContainer.appendChild(el);
        meteors.push({ el: el, x: startX, y: startY, age: 0 });
        
        triggerEarthquake();
    }

    function createBabyDino() {
        if (!isPlaying) return;
        const el = document.createElement('div');
        el.className = 'baby-dino stand-a';
        const randomHue = Math.floor(Math.random() * 360);
        el.style.filter = `hue-rotate(${randomHue}deg)`;
        gameContainer.appendChild(el);
        babyDinos.push({ el: el });
    }

    function createTrex() {
        if (!isPlaying) return;
        dino.classList.add('armed');
        isDucking = false;

        cactusList.forEach(cactus => {
            if (cactus && cactus.el) {
                cactus.el.remove();
            }
        });
        cactusList = [];
        obstacles = obstacles.filter(obs => !cactusList.includes(obs));

        trex = { x: 600, hp: 10, el: document.createElement('div') };
        trex.el.className = 'trex stand-a';
        trex.el.style.left = '600px';
        trex.el.style.bottom = '2px';

        const hpText = document.createElement('div');
        hpText.className = 'trex-hp';
        hpText.innerText = 'HP: 10';
        trex.hpEl = hpText;
        trex.el.appendChild(hpText);

        gameContainer.appendChild(trex.el);
    }

    // 최종 보스
    function createFinalBoss() {
        if (!isPlaying) return;
        dino.classList.add('armed');
        isDucking = false;

        // 모든 선인장 제거
        cactusList.forEach(cactus => {
            if (cactus && cactus.el) {
                cactus.el.remove();
            }
        });
        cactusList = [];
        obstacles = obstacles.filter(obs => !cactusList.includes(obs));

        finalBoss = { x: 600, hp: 15, el: document.createElement('div'), breathing: false };
        finalBoss.el.className = 'trex stand-a';
        finalBoss.el.style.left = '600px';
        finalBoss.el.style.bottom = '2px';
        finalBoss.el.style.animation = 'bossPulse 1s ease-in-out';

        const hpText = document.createElement('div');
        hpText.className = 'trex-hp';
        hpText.innerText = 'HP: 15';
        finalBoss.hpEl = hpText;
        finalBoss.el.appendChild(hpText);

        gameContainer.appendChild(finalBoss.el);
    }

    // 최종 보스 사망 연출
    function triggerFinalBossDeath() {
        if (!isPlaying) return;
        isPlaying = false;
        gameCleared = true;
        clearInterval(scoreInterval);
        clearInterval(gameLoopInterval);

        finalBoss.el.remove();
        finalBoss = null;

        setTimeout(() => {
            clearScreen.style.display = 'flex';
        }, 1000);

        setTimeout(() => {
            clearScreen.style.display = 'none';
            isPlaying = false;
            msgGameover.innerText = '<p class="gameover-text">CONGRATULATIONS!</p><p class="restart-text">화면을 터치하면 재시작</p>';
            msgGameover.style.display = 'flex';
        }, 3000);
    }

    function restoreCactus() {
        cactusList = [];
        obstacles = obstacles.filter(obs => !cactusList.includes(obs));
    }

    function createCloud() {
        if (!isPlaying) return;
        const cloudEl = document.createElement('div');
        cloudEl.classList.add('cloud');
        cloudEl.style.left = '600px';
        cloudEl.style.top = (Math.random() * 60 + 20) + 'px'; 
        cloudsContainer.appendChild(cloudEl);
        clouds.push({ el: cloudEl, x: 600 });
    }

    function createCactus(count) {
        if (!isPlaying || finalBoss) return;
        for (let i = 0; i < count; i++) {
            const obsEl = document.createElement('div');
            obsEl.classList.add('obstacle', 'cactus');
            const currentX = 600 + (i * 16); 
            obsEl.style.left = currentX + 'px';
            obstaclesContainer.appendChild(obsEl);
            const cactusObj = { el: obsEl, x: currentX, hitbox: { left: 2, right: 14, bottom: 0, top: 24 } };
            obstacles.push(cactusObj);
            cactusList.push(cactusObj);
        }
    }

    function createPtera() {
        if (!isPlaying) return;
        const obsEl = document.createElement('div');
        obsEl.classList.add('obstacle', 'ptera', 'fly-a');
        obsEl.style.left = '600px';
        const flyHeight = 28;
        obsEl.style.bottom = flyHeight + 'px';
        obstaclesContainer.appendChild(obsEl);
        obstacles.push({ el: obsEl, x: 600, hitbox: { left: -10, right: 50, bottom: flyHeight - 6, top: flyHeight + 20 }, isPtera: true });
    }

    function endGame() {
        if (!isPlaying) return;
        isPlaying = false;
        clearInterval(scoreInterval);
        clearInterval(gameLoopInterval);
        dino.className = (trex || finalBoss ? 'armed stand-a' : 'stand-a'); 

        gameContainer.style.overflow = 'visible'; 
        dino.style.zIndex = '100';
        dino.style.transition = 'all 1.8s cubic-bezier(0.25, 1, 0.5, 1)';
        
        dino.style.left = 'calc(50% - 22px)'; 
        dino.style.bottom = 'auto';
        dino.style.top = 'calc(50% - 16px)'; 
        
        dino.style.transform = 'scale(8) rotate(720deg)'; 

        setTimeout(() => {
            if (!isPlaying && score > hiScore) { 
                hiScore = score; 
                hiScoreDisplay.innerText = 'HI ' + String(hiScore).padStart(5, '0'); 
            }
            if (!isPlaying) msgGameover.style.display = 'flex';
        }, 1800);
    }

    // 게임 루프에서 익룡 애니메이션
    setInterval(() => {
        document.querySelectorAll('.ptera').forEach(ptera => {
            if (pteraFrame === 'a') {
                ptera.classList.remove('fly-b');
                ptera.classList.add('fly-a');
            } else {
                ptera.classList.remove('fly-a');
                ptera.classList.add('fly-b');
            }
        });
    }, 300);
</script>

</body>
</html>
